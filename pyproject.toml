[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-realize"
version = "0.1.0"
description = "Production-oriented toolkit for multimodal material download, labeling, archiving, and retrieval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "opencv-python>=4.9",
  "python-dotenv>=1.0",
  "openai>=1.30",
  "httpx>=0.27",
  "fastapi>=0.111",
  "pydantic>=2.7",
  "numpy>=1.26",
  "markdown>=3.6",
  "reportlab>=4.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
retrieval = [
  "sentence-transformers>=2.7",
  "fastembed>=0.3.0",
]
multimodal = [
  "openai-whisper>=20240930",
]

[project.scripts]
ai-content-realize = "ai_content_realize_cli:main"

[tool.setuptools]
py-modules = [
  "ai_content_realize_cli",
  "cache_sync_to_smb",
  "check_multimodal_deps",
  "download_materials_improved",
  "extract_frames",
  "gemini_label_materials",
  "gemma_dewu_archiver",
]

[tool.setuptools.packages.find]
include = ["multimodal_label_embedding*", "multimodal_label_service*"]
